en:
  label_caldav_tasks_subscription_url: Subscription URLs
  label_caldav_tasks_caldav_warning: >
    This plugin provides a read-only ICS feed (not a CalDAV server).
    Please add the URL as an "Internet calendar" or "ICS subscription" — not as a CalDAV account,
    as CalDAV protocol methods (PROPFIND, PUT, etc.) are not supported.
  label_caldav_tasks_client_column: Client
  label_caldav_tasks_url_column: Subscription URL
  label_caldav_tasks_note_column: Note
  label_caldav_tasks_row_thunderbird: Thunderbird
  label_caldav_tasks_row_thunderbird_note: >
    Task feed (VTODO). Thunderbird does not present an HTTP auth dialog —
    embed the API key directly in the URL (see below).
  label_caldav_tasks_row_ios_android: iOS / Android
  label_caldav_tasks_row_ios_android_note: >
    Task feed (VTODO) – displays all assigned issues as tasks.
    Enter credentials when subscribing.
  label_caldav_tasks_row_outlook: Outlook 2016+
  label_caldav_tasks_row_outlook_note: >
    Calendar feed (VEVENT) – displays issues with a due date as all-day events.
    Outlook silently ignores VTODO entries in ICS subscriptions, so this separate feed is required.
    Issues without a due date will not appear.
  label_caldav_tasks_auth_title: Authentication
  label_caldav_tasks_auth_step1: "Step 1: Open"
  label_caldav_tasks_auth_step1_suffix: "and copy your API access key."
  label_caldav_tasks_auth_step2: "Step 2: Enter credentials when subscribing (any one of the three options):"
  label_caldav_tasks_auth_step2_a: "Username = API key, Password = anything (e.g. x)"
  label_caldav_tasks_auth_step2_b: "Username = Redmine login, Password = API key"
  label_caldav_tasks_auth_step2_c: "Username = Redmine login, Password = Redmine password"
  label_caldav_tasks_auth_token_title: "Thunderbird / Clients without HTTP auth dialog"
  label_caldav_tasks_auth_token_hint: >
    Some clients (e.g. Thunderbird) do not send HTTP credentials when subscribing.
    In that case, embed the API key directly in the URL:
  label_caldav_tasks_auth_token_warning: >
    HTTPS encrypts the URL in transit — the key is not visible to network observers.
    However, it does appear in server-side access logs (nginx, Puma).
    Treat this URL like a password and do not share it.
  label_caldav_tasks_my_account: My Account
  label_caldav_tasks_project_selection: Project Selection
  label_caldav_tasks_all_projects: Include all projects
  label_caldav_tasks_all_projects_hint: "Also automatically includes projects created in the future."
  label_caldav_tasks_open_issues_only: Export open issues only
  label_caldav_tasks_project: Project
  label_caldav_tasks_include_exact: This project only
  label_caldav_tasks_include_with_subprojects: Incl. subprojects
  label_caldav_tasks_exact_hint: Include only issues directly in this project
  label_caldav_tasks_subprojects_hint: >
    Include issues in this project and all its subprojects.
    Newly created subprojects are automatically included.
  label_caldav_tasks_selection_hint: >
    Each user only sees issues assigned to them from the selected projects.
